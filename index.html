<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustStreamIt</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>JustStreamIt</h1>

    <nav>
      <a href="#top-rated">Films les mieux notés</a>
      <a href="#category-1">Action</a>
      <a href="#category-2">Drama</a>
    </nav>
  </header>

  <main>

    <section id="best-movie" class="hero-section">
      <h2>Meilleur film</h2>
    </section>

    <section id="top-rated" class="movie-section">
      <h2>Films les mieux notés</h2>
      <div class="movies-container"></div>
    </section>

    <section id="category-1" class="movie-section">
      <h2>Action</h2>
      <div class="movies-container"></div>
    </section>

    <section id="category-2" class="movie-section">
      <h2>Drama</h2>
      <div class="movies-container"></div>
    </section>

    <section id="category-choice" class="movie-section">
      <h2>Autres catégories</h2>

      <select id="genre-select">
        <option>Chargement...</option>
      </select>

      <div class="movies-container"></div>
    </section>

  </main>

  <dialog id="movie-modal"></dialog>

  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>

</body>
</html>
