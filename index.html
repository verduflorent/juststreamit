<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustStreamIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <div class="brand">
      <div class="logo-placeholder">◉</div>
      <span>JustStreamIt</span>
    </div>

    <p>Vidéos à la demande</p>
  </header>

  <main>

    <section id="best-movie" class="hero-section">
      <h2>Meilleur film</h2>
    </section>

    <section id="top-rated" class="movie-section">
      <h2>Films les mieux notés</h2>
      <div class="movies-container"></div>
    </section>

    <section id="category-1" class="movie-section">
      <h2>Action</h2>
      <div class="movies-container"></div>
    </section>

    <section id="category-2" class="movie-section">
      <h2>Drama</h2>
      <div class="movies-container"></div>
    </section>

    <section id="category-choice" class="movie-section">
      <h2>Autres catégories</h2>

      <select id="genre-select">
        <option>Chargement...</option>
      </select>

      <div class="movies-container"></div>
    </section>

  </main>

  <dialog id="movie-modal"></dialog>

  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>

</body>
</html>
